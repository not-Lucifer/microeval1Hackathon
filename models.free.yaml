# Free OpenRouter models (":free" ids cost $0). Ids checked against OpenRouter's live model
# list (GET https://openrouter.ai/api/v1/models) on 2026-10-31; free models come and go, so
# re-check on https://openrouter.ai/models?q=free before each run.
#
# Limits (OpenRouter, Oct 2026): 20 requests/minute and 50 requests/day across all free
# models while lifetime credit purchases are under $10; every attempt counts, including
# failed ones. One full run of one model = 8 tasks x 3 trials = 24 requests.
#
# Run with:
#   python run_eval.py --models models.free.yaml --trials 3 --max-cost 0 --concurrency 1 \
#                      --max-attempts 2 --max-requests 45
#
# max_tokens: free calls reserve no credit, so each model gets close to its own output limit
# (see docs/OPEN_QUESTIONS.md #36). The earlier paid run truncated Task 08 at 32,000.

defaults:
  temperature: 0
  reasoning: {effort: high}

models:
  - name: nemotron-3-ultra-free        # NVIDIA, 550B total / 55B active, output limit 65,536
    openrouter_id: nvidia/nemotron-3-ultra-550b-a55b:free
    max_tokens: 64000
  # thinkingmachines/inkling:free was dropped: OpenRouter answers 403 "only available on
  # agentic harnesses" to direct API calls (pilot, 2026-10-31).
  - name: dots-3-note-free             # Dots Studio, 280B total / 16B active, output limit 460,800
    openrouter_id: dots-studio/dots-3-note-preview:free
    max_tokens: 64000
  - name: gemma-4-31b-free             # Google, open weights, output limit 32,768. Its free provider
    openrouter_id: google/gemma-4-31b-it:free  # answered 429 to every pilot call; the runner
    max_tokens: 32000                  # skips it after 2 failed calls in a row, so it costs little
